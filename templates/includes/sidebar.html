<aside class="sidebar">
    <div class="sidebar-header">
        <a href="{% url 'dashboard:index' %}" class="sidebar-brand">
            <i class="bi bi-building"></i>
            Estate<span class="brand-accent">Basic</span>
        </a>
    </div>

    <nav class="sidebar-nav">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a href="{% url 'dashboard:index' %}" class="nav-link {% if '/dashboard' in request.path %}active{% endif %}">
                    <i class="bi bi-speedometer2"></i> داشبورد
                </a>
            </li>
            
            {% if user.is_superuser %}
            <li class="nav-item">
                <a href="{% url 'customers:list' %}" class="nav-link {% if '/customers' in request.path %}active{% endif %}">
                    <i class="bi bi-people"></i> مشتری‌ها
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'properties:list' %}" class="nav-link {% if '/properties' in request.path %}active{% endif %}">
                    <i class="bi bi-building"></i> املاک
                </a>
            </li>
            {% endif %}
            
            <li class="nav-item">
                <a href="{% url 'properties:favorites' %}" class="nav-link {% if '/favorites' in request.path %}active{% endif %}">
                    <i class="bi bi-heart"></i> علاقه‌مندی‌ها
                </a>
            </li>
            <li class="nav-item">
                <a href="{% url 'pages:search' %}" class="nav-link">
                    <i class="bi bi-search"></i> جستجوی املاک
                </a>
            </li>
        </ul>
    </nav>

    <div class="sidebar-footer">
        <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light w-100">
                <i class="bi bi-box-arrow-right"></i> خروج
            </button>
        </form>
    </div>
</aside>
