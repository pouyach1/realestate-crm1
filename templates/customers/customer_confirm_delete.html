{% extends 'base.html' %}

{% block title %}حذف {{ customer.name }} - Estate Basic{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card text-center p-5">
            <i class="bi bi-exclamation-triangle" style="font-size: 3rem; color: #e74c3c;"></i>
            <h3 class="mt-3">حذف مشتری؟</h3>
            <p class="text-muted">
                آیا از حذف <strong>{{ customer.name }}</strong> اطمینان دارید؟
                این عملیات قابل بازگشت نیست.
            </p>
            <form method="post" class="mt-4">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    <i class="bi bi-trash me-2"></i> بله، حذف کن
                </button>
                <a href="{% url 'customers:detail' customer.pk %}" class="btn btn-outline-secondary">
                    انصراف
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
